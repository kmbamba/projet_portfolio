<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajouter un nouveau projet</title>
  <link rel="stylesheet" href="../src/css/output.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <!-- Header -->
  <header class="bg-gray-800 text-white px-6 py-4 flex items-center justify-between">
    <a href="../index.html">
      <img src="listes-projets/img/logo.jpeg" alt="Logo du Portfolio" class="w-16 h-16 rounded-full object-cover">
    </a>
    <nav class="bg-gray-700 px-6 py-2 rounded-xl flex gap-8">
      <a href="lister-projet.html" class="text-white text-lg hover:text-green-400 transition-colors">Liste</a>
      <a href="#" class="text-green-400 text-lg font-semibold">Ajouter</a>
      <a href="contact.html" class="text-white text-lg hover:text-green-400 transition-colors">Contacts</a>
    </nav>
  </header>
      <!-- Main -->
  <main class="max-w-2xl mx-auto my-8 p-6 bg-white rounded-xl shadow-md">

    <div class="mb-4">
      <a href="../index.html" class="inline-flex items-center gap-2 bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
        🔙 Retour à l'accueil
      </a>
    </div>

    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Ajouter un nouveau projet</h2>

    <form id="addProjectForm" class="flex flex-col gap-4">

      <div class="flex flex-col gap-1">
        <label for="projectName" class="text-sm font-semibold text-gray-700">Nom du projet :</label>
        <input type="text" id="projectName" name="projectName" required
          class="border border-blue-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 w-full">
      </div>

      <div class="flex flex-col gap-1">
        <label for="projectDescription" class="text-sm font-semibold text-gray-700">Description du projet :</label>
        <textarea id="projectDescription" name="projectDescription" required rows="4"
          class="border border-blue-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 w-full resize-none"></textarea>
      </div>

      <div class="flex flex-col gap-1">
        <label for="projectTechnology1" class="text-sm font-semibold text-gray-700">Technologie 1 :</label>
        <input type="text" id="projectTechnology1" name="projectTechnology1" required
          class="border border-blue-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 w-full">
      </div>

      <div class="flex flex-col gap-1">
        <label for="projectTechnology2" class="text-sm font-semibold text-gray-700">Technologie 2 :</label>
        <input type="text" id="projectTechnology2" name="projectTechnology2" required
          class="border border-blue-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 w-full">
      </div>

      <div class="flex flex-col gap-1">
        <label for="projectTechnology3" class="text-sm font-semibold text-gray-700">Technologie 3 :</label>
        <input type="text" id="projectTechnology3" name="projectTechnology3" required
          class="border border-blue-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 w-full">
      </div>

      <div class="flex flex-col gap-1">
        <label for="projectImage" class="text-sm font-semibold text-gray-700">Image du projet :</label>
        <input type="file" id="projectImage" name="projectImage" accept="image/*"
          class="border border-blue-300 rounded-lg px-3 py-2 w-full text-sm text-gray-600 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-blue-500 file:text-white hover:file:bg-blue-600">
      </div>

      <div class="flex justify-center gap-16 pt-4">
        <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg font-medium transition-colors">
          Ajouter le projet
        </button>
        <button type="reset" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg font-medium transition-colors">
          Annuler
        </button>
      </div>

    </form>
  </main>
  <!-- Footer -->
  <footer class="bg-gray-800 text-white text-center py-4 mt-8">
    <p>&copy; 2026 G4 Fullstack Portfolio</p>
  </footer>
</body>
</html>
